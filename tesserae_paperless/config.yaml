name: Tesserae + paperlesspaper
version: "0.1.0"
slug: tesserae_paperless
description: >-
  Tesserae with the Overhead fork and a paperlesspaper bridge: compose e-ink
  dashboards in Home Assistant and send them to paperlesspaper frames on
  their own firmware, and switch what each frame shows.
url: https://github.com/Emacee/Tesserae-Paperlesspaper
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8765
panel_icon: mdi:image-frame
panel_title: Tesserae
# Off by default: a paperlesspaper frame never connects to Tesserae (frames go
# out through the paperlesspaper cloud). Set a host port on the Network tab
# for other panels (ESP32, Kindle, TRMNL) that fetch frames from Tesserae.
ports:
  "8765/tcp": null
ports_description:
  "8765/tcp": Tesserae API for panels that fetch their frames (not needed for paperlesspaper)
homeassistant_api: false
hassio_api: true
host_network: false
map:
  - share:rw
  - media:rw
environment:
  TESSERAE_HA_INGRESS: "1"
  TESSERAE_DATA_ROOT: "/data"
  TESSERAE_HTTP_PORT: "8765"
  TESSERAE_BIND_PORT: "8765"
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
options:
  log_level: info
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
