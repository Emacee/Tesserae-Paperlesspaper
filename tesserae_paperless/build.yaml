# Supervisor builds this app on the Home Assistant host from the official
# Tesserae image, adding this repository's widgets, the paperlesspaper plugin
# and the paperlesspaper device kind (see Dockerfile).
build_from:
  aarch64: ghcr.io/dmellok/tesserae:0.480.0
  amd64: ghcr.io/dmellok/tesserae:0.480.0
args:
  # The commit (or tag) of this repository the image is built from: move it,
  # and bump `version` in config.yaml, so Home Assistant offers the update.
  WIDGETS_REF: 8b2f7aac9777a1af28e3afc2a7fe20ef6ba5f359
  WIDGETS_REPO: Emacee/Tesserae-Paperlesspaper
